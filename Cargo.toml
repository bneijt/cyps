[package]
name = "cyps"
version = "1.0.0"
edition = "2024"
description = "A programmer's clean-up utility"
license = "GPL-3.0-or-later"

# Dependencies are limited to a small CLI parser and directory walker.
[dependencies]
clap = { version = "4.5", default-features = false, features = ["std", "help", "usage", "error-context"] }
walkdir = "2.5"

# Keep the release binary as small as possible.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
